# ~/.tmux.conf

# Use a modern terminal description so Neovim themes can render 256-color/truecolor correctly.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",tmux-256color:RGB,xterm-256color:RGB"

# Plugin manager and theme
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'arcticicestudio/nord-tmux'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'kiyoon/treemux'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Treemux sidebar
set -g @treemux-tree-client 'nvim-tree'
set -g @treemux-tree-nvim-init-file '$HOME/.tmux/plugins/treemux/configs/treemux_init.lua'
set -g @treemux-python-command '$HOME/.local/share/treemux-venv/bin/python'

# Enable mouse scrolling for tmux-mighty-scroll
set -g mouse on
set -g @mighty-scroll-interval 1
set -g @mighty-scroll-select-pane off
set -g @mighty-scroll-fallback-mode 'pass-through'
set -g @mighty-scroll-show-indicator on

# Keep tmux config hot-reloaded and surface prefix state in the status bar
set -g @tmux-autoreload-entrypoints 1
set -g @tmux-autoreload-quiet 1

# Window and pane indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Session name spacing
set -g status-left-length 50

# Initialize TPM last
run '~/.tmux/plugins/tpm/tpm'

# CPU/MEM status helpers. Define these after TPM so our custom status-right
# overrides Nord's default segment.
set -g @cpu_mem_plugin_dir "$HOME/.tmux/plugins/tmux-cpu-mem-monitor"
set -g @status_prefix_segment "#{?client_prefix,#[fg=black]#[bg=brightcyan]#[fg=brightcyan]#[bg=black]#[nobold]#[noitalics]#[nounderscore]#[bg=brightcyan]#[fg=black]^B,#[default]#[fg=default]#[bg=default]}"
set -g @status_metric_style "#[fg=white,bg=brightblack]"
set -g @status_metric_separator "#[fg=white,bg=brightblack,nobold,noitalics,nounderscore]"
set -g @cpu_cmd "#(cd \"#{@cpu_mem_plugin_dir}\" && uv run --project \"#{@cpu_mem_plugin_dir}\" --quiet python \"#{@cpu_mem_plugin_dir}/src/cpu.py\")"
set -g @mem_cmd "#(cd \"#{@cpu_mem_plugin_dir}\" && uv run --project \"#{@cpu_mem_plugin_dir}\" --quiet python \"#{@cpu_mem_plugin_dir}/src/mem.py\")"

# Nord-styled right segment with CPU/MEM (replaces date/time/host)
set -g status-right "#{E:@status_prefix_segment}#[default]#[fg=brightblack,bg=black,nobold,noitalics,nounderscore]#{E:@status_metric_style}  #{E:@cpu_cmd} #{E:@status_metric_separator}#{E:@status_metric_style}  #{E:@mem_cmd} "

# Dispay Popups
bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

