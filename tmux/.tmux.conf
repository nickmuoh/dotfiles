# ~/.tmux.conf

# Use a modern terminal description so Neovim themes can render 256-color/truecolor correctly.
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-features ",tmux-256color:RGB,xterm-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u

# Keep the user session bus and keyring env visible after attach so Secret Service
# clients inside tmux can reach the system vault.
set -ga update-environment "DBUS_SESSION_BUS_ADDRESS"
set -ga update-environment "GNOME_KEYRING_CONTROL"
set -ga update-environment "XDG_RUNTIME_DIR"

# Plugin manager and theme
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'arcticicestudio/nord-tmux'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'kiyoon/treemux'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'sainnhe/tmux-fzf'
# Replace tmux's native `prefix + f` find-window command with tmux-fzf's
# interactive selector, which also provides window finding.
TMUX_FZF_LAUNCH_KEY='f'

# Treemux sidebar
set -g @treemux-tree-client 'nvim-tree'
set -g @treemux-tree-nvim-init-file '$HOME/.tmux/plugins/treemux/configs/treemux_init.lua'
set -g @treemux-python-command '$HOME/.local/share/treemux-venv/bin/python'

# Enable mouse scrolling for tmux-mighty-scroll
set -g mouse on
set -g @mighty-scroll-interval 1
set -g @mighty-scroll-select-pane off
set -g @mighty-scroll-fallback-mode 'pass-through'
set -g @mighty-scroll-show-indicator on
set -g @mighty-scroll-by-line 'man less pager fzf batcat'

# Keep tmux config hot-reloaded and surface prefix state in the status bar
set -g @tmux-autoreload-entrypoints 1
set -g @tmux-autoreload-quiet 1

# Window and pane indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Session name spacing
set -g status-left-length 50
set -g status-position bottom
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# CPU/MEM status theme knobs.
set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg 'brightcyan'
set -g @prefix_highlight_prefix_prompt '^A'
set -g @cpu_mem_lead_style "#[default]#[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g @cpu_mem_metric_style "#[fg=white,bg=brightblack]"
set -g @cpu_mem_metric_separator "#[fg=white,bg=brightblack,nobold,noitalics,nounderscore]"
set -g @cpu_mem_cpu_icon ""
set -g @cpu_mem_mem_icon ""

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
# Remove tmux-fzf's default `prefix + F` binding and the old `prefix + C-f`
# binding so reloading this config leaves only `prefix + f` active.
unbind-key F
unbind-key C-f

# Let the vendored CPU/MEM plugin build the final right status segment, then
# rerun prefix-highlight as the last status-right rewrite.
run-shell 'bash ~/.tmux/plugins/tmux-cpu-mem-monitor/tmux_cpu_mem_monitor.tmux'
run-shell 'bash ~/.tmux/plugins/tmux-prefix-highlight/prefix_highlight.tmux'

# Display popups.
bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

# Layout-style pane controls.
# Enter the layout key table with either `Ctrl+w` directly or `prefix + Ctrl+w`.
# The prefixed form must be bound in the prefix table; `-n` alone only handles
# the direct form.
bind-key -n C-w switch-client -T layout
bind-key C-w switch-client -T layout

# Move focus to an adjacent pane.
bind-key -T layout h select-pane -L
bind-key -T layout j select-pane -D
bind-key -T layout k select-pane -U
bind-key -T layout l select-pane -R

# Swap the current pane with the neighboring pane. Omitting `-s` is
# important: `!` means the last active pane, not the current pane.
bind-key -T layout H swap-pane -t '{left-of}'
bind-key -T layout J swap-pane -t '{down-of}'
bind-key -T layout K swap-pane -t '{up-of}'
bind-key -T layout L swap-pane -t '{right-of}'

# Split the current pane, toggle its zoom, or close it. Zooming temporarily
# hides the other panes without destroying them; `x` closes the current pane.
bind-key -T layout '|' split-window -h
bind-key -T layout '-' split-window -v
bind-key -T layout z resize-pane -Z
bind-key -T layout x kill-pane

# Keep mouse selection visible without copying on release.
unbind-key -T copy-mode MouseDragEnd1Pane
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# Use Vim-style tmux copy mode with explicit y-to-copy.
set -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Apply common layout presets.
bind-key -T layout 1 select-layout even-horizontal
bind-key -T layout 2 select-layout even-vertical
bind-key -T layout 3 select-layout main-vertical
bind-key -T layout 4 select-layout tiled
