git:
  branchLogCmd: sh -c 'git log --graph --color=always --abbrev-commit --decorate --oneline {{branchName}} -- | sed -e s/\\*/●/ -e s/\\|/│/'
  diffRenderers:
    - type: extDiff
      command: difft --color=always --context={{diffContext}}
      name: difftastic
    - type: rawGit
      name: unified
customCommands:
  - key: "<c-g>"
    description: "Generate AI commit message"
    context: "files"
    loadingText: "Generating commit message..."
    command: >
      bash -c '

        PROMPT="$HOME/.config/lazygit/git-commit-msg.prompt.md"

        git diff --cached | pi -p --no-session --no-tools \
          --no-context-files --no-skills --no-extensions \
          --provider ollama --model "gpt-oss:20b-cloud" \
          --system-prompt "$(cat "$PROMPT")" \
        > /tmp/commit_msg

        git commit -e -m "$(cat /tmp/commit_msg)"
      '
    output: terminal
